# Builds the Jangdan landing (site root) and the IWSDK app (/app/) and publishes
# them to GitHub Pages: https://nickthelegend.github.io/jangdan/ and .../jangdan/app/
# Repo settings: Pages source = "GitHub Actions". No AI, no keys.
# Competition freeze: no pushes from Nov 18, 2026 20:00 UTC until winners (~Dec 11).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the lockfiles were made with legacy-peer-deps (as on the dev Mac); npm ci must match
      npm_config_legacy_peer_deps: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core tests
        working-directory: packages/core
        run: npm ci && npm test
      - name: Build the app (relative base, served at /jangdan/app/)
        working-directory: packages/app
        env:
          NODE_ENV: production
        run: npm ci --include=dev && npm run typecheck && npm run build
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R packages/landing/. site/
          rm -f site/package.json
          cp -R packages/app/dist site/app
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
